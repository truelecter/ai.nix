# Repository settings, applied by the Settings GitHub app (https://github.com/repository-settings/app).
branches:
- name: main
  protection:
    enforce_admins: false
    required_pull_request_reviews: null
    required_status_checks:
      contexts:
      - paseo_e2e_aggregated
      strict: true
    restrictions: null
repository:
  allow_auto_merge: true
  allow_merge_commit: true
  allow_rebase_merge: false
  allow_squash_merge: true
  default_branch: main
  delete_branch_on_merge: true
  description: flake-parts module with my ai-related setup
  has_downloads: false
  has_issues: true
  has_projects: true
  has_wiki: true
  name: ai.nix
  private: false
