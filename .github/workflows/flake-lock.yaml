# Weekly `nix flake update` as a pull request with auto-merge. PR_WF_ENABLED_TOKEN is a token whose
# pushes start workflows (GITHUB_TOKEN's don't), so the end-to-end suite runs on the pull request.
name: Update flake.lock
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6" # At 00:00 on Saturday

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          diagnostic-endpoint: ""
          summarize: false

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v21
        id: ufl
        with:
          token: ${{ secrets.PR_WF_ENABLED_TOKEN }}
          pr-title: "[Automated] Update 'flake.lock'"
          branch: "auto/update-flake-lock"
          commit-msg: "deps(repo): update flake.lock"
          pr-labels: |
            dependencies
            automated

      - name: Enable auto-merge
        if: ${{ steps.ufl.outputs.pull-request-number != '' }}
        run: |
          gh pr merge --squash --auto "$PR_NUMBER" --subject "deps(repo): update flake.lock"
        env:
          GH_TOKEN: ${{ secrets.PR_WF_ENABLED_TOKEN }}
          PR_NUMBER: ${{ steps.ufl.outputs.pull-request-number }}
