# End-to-end tests of the Paseo plugins (paseo-plugins/_e2e, see AGENTS.md).
# The suite only runs when something it depends on changed; `paseo_e2e_aggregated` always reports,
# so it can be a required check (a path filter on the trigger would leave it pending).
name: Paseo plugins end-to-end tests
on:
  push:
  workflow_call:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes the suite depends on
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
            - flake.lock
            - flake.nix
            - 'paseo-plugins/**'
            - .github/workflows/paseo-plugins-e2e.yaml

  e2e:
    needs: [changes]
    if: ${{ needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Filesystem on /mnt for some reason has more space on GitHub action
      # runner than /
      - name: Bind mount /nix
        run: |
          sudo mkdir /mnt/nix /nix
          sudo chmod 0755 /nix
          sudo mount --bind /mnt/nix /nix

      - name: Checkout repository
        uses: actions/checkout@v4

      # Determinate Nix retries a NAR download that broke mid-stream even when the server doesn't
      # support ranged requests. nix-proxy is a read-only cache in front of cache.nixos.org.
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          diagnostic-endpoint: ""
          summarize: false
          extra-conf: |
            substituters = https://nix-proxy.tlctr.me https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-proxy.tlctr.me:o0mf52dfc6glFzwRRquMmGaphNAidwF6L/q2IFyB9qk= workflows:nGqDVYKhDZxnNXIemS1/Bq2+i1wwQ6GE/xG2OIiMNDw=
            filetransfer-retry-attempts = 10
            filetransfer-retry-delay = 1000
            http2 = false
            stalled-download-timeout = 60

      - name: Run the suite
        env:
          # A fixed temp root, kept on failure, so the next step knows what to upload.
          PASEO_E2E_ROOT: ${{ runner.temp }}/paseo-e2e
        run: nix run -L .#paseo-plugins-e2e

      - name: Upload the daemon home, logs, and Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: paseo-plugins-e2e
          path: |
            ${{ runner.temp }}/paseo-e2e
            !${{ runner.temp }}/paseo-e2e/**/*.sock
          if-no-files-found: ignore
          retention-days: 14

  paseo_e2e_aggregated:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [changes, e2e]
    steps:
      # Passes when the suite passed or was not needed (e2e skipped).
      - run: exit 1
        if: >-
          ${{
            needs.changes.result != 'success'
            || needs.e2e.result == 'failure'
            || needs.e2e.result == 'cancelled'
          }}
